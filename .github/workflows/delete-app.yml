name: Delete App

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: "Repo name (e.g. python-fastapi-template)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  delete-app:
    name: Delete Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy delete script to VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "codebuild/delete_app.sh"
          target: "/tmp"

      - name: Delete app on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            chmod +x /tmp/codebuild/delete_app.sh
            sudo /tmp/codebuild/delete_app.sh "${{ inputs.repo_name }}"
            rm -rf /tmp/codebuild
