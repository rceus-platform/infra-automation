name: Delete App

on:
    workflow_dispatch:
        inputs:
            repo_name:
                description: "Repo name (e.g. python-fastapi-template)"
                required: true

jobs:
    delete:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Copy delete script to VM
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.VM_HOST }}
                  username: ${{ secrets.VM_USER }}
                  key: ${{ secrets.VM_SSH_KEY }}
                  source: "codebuild/delete_app.sh"
                  target: "/tmp"

            - name: Delete app on VM
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VM_HOST }}
                  username: ${{ secrets.VM_USER }}
                  key: ${{ secrets.VM_SSH_KEY }}
                  script: |
                      set -e
                      chmod +x /tmp/codebuild/delete_app.sh
                      sudo /tmp/codebuild/delete_app.sh "${{ github.event.inputs.repo_name }}"
                      rm -rf /tmp/codebuild
